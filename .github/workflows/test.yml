name: Unit Tests

on:
  pull_request:
    branches:
      - develop
      - test
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `version:` here on purpose — the version comes from the
      # `packageManager` field in package.json, which is the single pin for
      # local installs and CI alike. Setting both makes the action fail with
      # ERR_PNPM_BAD_PM_VERSION.
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test
