<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ZentroHR">
  <title>ZentroHR</title>

  <defs>
    <linearGradient id="zentrohr-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C4CF1" />
      <stop offset="1" stop-color="#9B82FA" />
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="492" height="492" rx="115" fill="url(#zentrohr-icon)" />

  <!--
  The tab icon, so this is the simplified cut of the mark: the broken ring that
  circles the Z in the full app icon is a hairline — around half a pixel at 32px
  — and only muddies the tile at the sizes a favicon is actually seen. Browsers
  that support SVG favicons use this file at every size, so the detail cannot be
  reintroduced at larger ones; `apple-icon.png` carries the full artwork instead.

  The glyph is scaled up about the centre for the same reason: it has to grow
  into the tile's padding to stay legible in a 16px tab.
  -->
  <g transform="translate(256 256) scale(1.22) translate(-256 -256)">
    <circle cx="366" cy="191" r="42" fill="#CCC2F7" />
    <path
      d="M146 184H366L146 322H366"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
